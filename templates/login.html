{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Welcome back</h1><p class="sub">Log in to see your attendance.</p>
  <form method="post" data-busy>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label><input id="email" name="email" type="email" required autofocus autocomplete="email" value="{{ email }}">
    <label for="password">Password</label>
    <div class="pw"><input id="password" name="password" type="password" required autocomplete="current-password"><button type="button">Show</button></div>
    <button class="btn block" style="margin-top:22px" type="submit">Log in</button>
  </form>
  <p class="muted" style="text-align:center;margin-bottom:0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
